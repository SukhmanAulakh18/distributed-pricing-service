name: release

# Main publishes only after the ci workflow succeeded on that commit; version
# tags publish directly.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]

permissions:
  contents: read

# Never cancel a publish half-way: a partly pushed, unsigned image is worse
# than a queued one.
concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Tag pushes run unconditionally; workflow_run only after a green ci push.
    if: github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    permissions:
      contents: read
      packages: write
      id-token: write  # keyless cosign signing via GitHub OIDC
    steps:
      - uses: actions/checkout@v4
        with:
          # For workflow_run, GITHUB_SHA is the default-branch tip, not the
          # commit ci tested; build exactly the tested one.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Image references must be lowercase; the owner name is not. metadata-
      # action lowercases on its own, but the scan and signing steps need the
      # exact pushed name, so derive it once here.
      - id: img
        run: |
          echo "name=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "sha=$(echo "$COMMIT" | cut -c1-7)" >> "$GITHUB_OUTPUT"
        env:
          COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=sha-${{ steps.img.outputs.sha }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # 1. Build locally only: nothing is pushed until the scan passes.
      # (load does not support SBOM/provenance attestations.)
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: mc-pricer:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # 2. Gate on the local image. Fails the job before anything is pullable.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0, pinned by SHA: tags on this action have been rewritten before
        with:
          image-ref: mc-pricer:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      # 3. Publish. The layers are a cache hit from step 1, so this is the
      # same content plus attestations.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac  # v3
      - name: Sign the image by digest (keyless)
        run: cosign sign --yes "${NAME}@${DIGEST}"
        env:
          NAME: ${{ steps.img.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
