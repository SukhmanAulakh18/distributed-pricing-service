name: release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

# Never cancel a publish half-way: a partly pushed, unsigned image is worse
# than a queued one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write  # keyless cosign signing via GitHub OIDC
    steps:
      - uses: actions/checkout@v4
      # Image references must be lowercase; the owner name is not. metadata-
      # action lowercases on its own, but the scan and signing steps need the
      # exact pushed name, so derive it once here.
      - id: img
        run: echo "name=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Scan by digest after the push (the registry copy is what ships). Fails
      # the job, so the signing step below never signs a vulnerable image.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0, pinned by SHA: tags on this action have been rewritten before
        with:
          image-ref: ${{ steps.img.outputs.name }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image by digest (keyless)
        run: cosign sign --yes "${NAME}@${DIGEST}"
        env:
          NAME: ${{ steps.img.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
