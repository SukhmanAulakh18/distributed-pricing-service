global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/rules/*.yml]
alerting:
  alertmanagers:
    - static_configs: [{targets: ["alertmanager:9093"]}]

scrape_configs:
  - job_name: api
    dns_sd_configs:
      - names: [api]
        type: A
        port: 8000
  # Compose DNS returns one A record per worker replica, so every worker
  # is scraped individually.
  - job_name: worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9100
