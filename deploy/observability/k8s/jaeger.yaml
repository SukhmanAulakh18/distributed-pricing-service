# Jaeger v2 all-in-one: OTLP receivers (4317 gRPC, 4318 HTTP) and the UI,
# with in-memory storage, which is fine for a demo cluster. Production would
# use a collector deployment with Cassandra, Elasticsearch or object storage.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
spec:
  replicas: 1
  selector:
    matchLabels: {app: jaeger}
  template:
    metadata:
      labels: {app: jaeger}
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.21.0
          ports:
            - {containerPort: 4317, name: otlp-grpc}
            - {containerPort: 4318, name: otlp-http}
            - {containerPort: 16686, name: ui}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
spec:
  type: NodePort
  selector: {app: jaeger}
  ports:
    - {port: 4317, targetPort: otlp-grpc, name: otlp-grpc}
    - {port: 4318, targetPort: otlp-http, name: otlp-http}
    - {port: 16686, targetPort: ui, name: ui, nodePort: 30686}
