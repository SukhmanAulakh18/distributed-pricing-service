# Routes every alert to the team that owns it (the `owner` label), the same
# ownership table as RUNBOOK.md. Receivers are empty here; in production each
# would be a pager, chat channel or ticket queue.
route:
  receiver: core-engineering
  group_by: [alertname, owner]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h
  routes:
    # Must stay first (before the owner routes). The heartbeat repeats often so
    # a dead-man's switch downstream notices within minutes if it stops.
    - {matchers: ['alertname="Watchdog"'], receiver: watchdog, group_by: [alertname], repeat_interval: 5m}
    # Pages go to a paging receiver, tickets to a queue; owner picks the team.
    - {matchers: ['severity="page"', 'owner="database"'], receiver: database-page}
    - {matchers: ['severity="page"', 'owner="platform"'], receiver: platform-page}
    - {matchers: ['severity="page"', 'owner="quant"'], receiver: quant-page}
    - {matchers: ['severity="page"'], receiver: core-page}
    - {matchers: ['owner="database"'], receiver: database-ticket}
    - {matchers: ['owner="platform"'], receiver: platform-ticket}
    - {matchers: ['owner="quant"'], receiver: quant-ticket}
    - {matchers: ['owner="core"'], receiver: core-ticket}
receivers:
  - name: core-engineering
  - name: core-page
  - name: core-ticket
  - name: database-page
  - name: database-ticket
  - name: platform-page
  - name: platform-ticket
  - name: quant-page
  - name: quant-ticket
  - name: watchdog
inhibit_rules:
  # One root cause, one page: when Redis or a node is down, the backlog and
  # stuck-task alerts it causes are noise.
  - source_matchers: ['alertname=~"RedisCircuitOpen|NodeNotReady"']
    target_matchers: ['alertname=~"IntradayBacklog|TasksStuckPending"']
    # Only inhibit within one namespace. A label missing on both sides counts
    # as equal, so today's aggregated (label-less) alerts still match.
    equal: [namespace]
