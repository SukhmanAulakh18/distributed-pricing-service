apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricer-worker-intraday
spec:
  replicas: 2
  selector:
    matchLabels: {app: pricer-worker, pool: intraday}
  template:
    metadata:
      labels: {app: pricer-worker, pool: intraday}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      # Matches the Dockerfile's uid 10001. The root filesystem is read-only;
      # /tmp is the only writable path (libraries and OpenTelemetry may need it).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      # SIGTERM lets the worker finish its current task; anything unacked
      # after that is reclaimed by another worker via XAUTOCLAIM.
      terminationGracePeriodSeconds: 30
      tolerations:
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway,
           labelSelector: {matchLabels: {app: pricer-worker, pool: intraday}}}
      containers:
        - name: worker
          image: mc-pricer:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "service.worker"]
          ports: [{containerPort: 9100, name: metrics}]
          envFrom:
            - configMapRef: {name: pricer-config}
          env:
            - {name: WORKER_STREAMS, value: intraday}
            - {name: OTEL_SERVICE_NAME, value: pricing-worker-intraday}
          resources: {requests: {cpu: 500m, memory: 192Mi}, limits: {cpu: "2", memory: 512Mi}}
          livenessProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 15
          # The metrics server starts before the Redis connection, so this only
          # gates rollouts on the process being up; Redis loss shows as backlog.
          readinessProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pricer-worker-intraday
spec:
  maxUnavailable: 1  # a drain never stops the whole pool; unacked tasks are reclaimed anyway
  selector:
    matchLabels: {app: pricer-worker, pool: intraday}
