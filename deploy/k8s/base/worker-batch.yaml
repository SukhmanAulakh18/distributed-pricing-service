apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricer-worker-batch
spec:
  replicas: 2
  selector:
    matchLabels: {app: pricer-worker, pool: batch}
  template:
    metadata:
      labels: {app: pricer-worker, pool: batch}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      # SIGTERM lets the worker finish its current task; anything unacked
      # after that is reclaimed by another worker via XAUTOCLAIM.
      terminationGracePeriodSeconds: 30
      tolerations:
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway,
           labelSelector: {matchLabels: {app: pricer-worker, pool: batch}}}
      containers:
        - name: worker
          image: mc-pricer:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "service.worker"]
          ports: [{containerPort: 9100, name: metrics}]
          envFrom:
            - configMapRef: {name: pricer-config}
          env:
            - {name: WORKER_STREAMS, value: batch}
            - {name: OTEL_SERVICE_NAME, value: pricing-worker-batch}
          resources: {requests: {cpu: "1", memory: 256Mi}, limits: {cpu: "2", memory: 768Mi}}
          livenessProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 15
