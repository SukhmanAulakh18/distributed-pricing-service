# Local multi-node cluster (kind): the application plus the in-cluster
# observability stack. NodePorts are published on localhost by
# deploy/kind-config.yaml (API on :8080). kubectl port-forward pins to one pod,
# which would void the failure tests, so the API goes through kube-proxy.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../../../observability
patches:
  - target: {kind: Service, name: pricer-api}
    patch: |
      - op: add
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
